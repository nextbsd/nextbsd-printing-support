# sources.lock: every upstream source nextbsd-printing-support builds, pinned.
#
# One line per component:  <name> <version> <sha256> <url>
# <name> matches build_<name> in build-printing-support.sh (hyphens as
# underscores) and patches/<name>/. build-printing-support.sh downloads <url>
# (cached in .build/dl), refuses it unless its SHA-256 is <sha256>, and unpacks
# it. Only upstream release tarballs or tag archives are listed: no FreeBSD
# packages or ports distfiles. Bumping a version is a deliberate change to this
# file.

